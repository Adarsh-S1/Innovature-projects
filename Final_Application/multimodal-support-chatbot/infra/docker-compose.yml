# ══════════════════════════════════════════════════════════════════════════
# Multimodal Support Chatbot — Local Development Stack
# Brings up Milvus, Redis, RustFS, and Etcd for the full dev environment.
# Usage: docker-compose up -d
# ══════════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── Etcd (required by Milvus) ──────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chatbot-net

  # ── RustFS (S3-compatible object storage) ───────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: milvus-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: /data
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:9000" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chatbot-net

  # ── Milvus Standalone ──────────────────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.13-hotfix
    container_name: milvus-standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: rustfsadmin
      MINIO_SECRET_ACCESS_KEY: rustfsadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: [ "milvus", "run", "standalone" ]
    depends_on:
      etcd:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chatbot-net

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-net

  attu:
    image: zilliz/attu:v2.4
    container_name: milvus-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8001:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - chatbot-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8002:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chatbot-net

  # ── Celery Worker (Background PDF Processing) ──────────────────────────
  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chatbot-celery
    # Override the default uvicorn command to run celery instead
    command: [ "celery", "-A", "app.ingestion.tasks.celery_app", "worker", "--loglevel=info" ]
    volumes:
      # Mount your local code so changes reflect immediately without rebuilding
      - ../app:/app/app
      - ../scripts:/app/scripts
      # Share the host's /tmp folder so Celery can read the PDFs uploaded by local FastAPI
      - /tmp:/tmp
      # Persistent named volume for HuggingFace AI models (industry standard)
      - model_cache:/home/appuser/.cache/huggingface
    env_file:
      - ../.env
    environment:
      # Point to the Docker containers instead of localhost
      - REDIS_HOST=redis
      - MILVUS_HOST=milvus
      - RUSTFS_ENDPOINT=rustfs:9000
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - chatbot-net
    # UNCOMMENT THIS BLOCK IF YOU HAVE NVIDIA DOCKER CONFIGURED FOR GPU ACCELERATION
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  etcd_data:
  rustfs_data:
  milvus_data:
  redis_data:
  model_cache:

networks:
  chatbot-net:
    driver: bridge
