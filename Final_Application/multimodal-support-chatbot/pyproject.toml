[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-support-chatbot"
version = "1.0.0"
description = "Multimodal Intelligent Customer Support Chatbot — Multi-Agent LangGraph + RAG Pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    # ── API Server ───────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # ── Agent Orchestration ──────────────────────────────────────────
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",

    # ── LLM ──────────────────────────────────────────────────────────
    "openai>=1.50",

    # ── Vector Database ──────────────────────────────────────────────
    "pymilvus>=2.4",

    # ── PDF Processing ───────────────────────────────────────────────
    "pymupdf>=1.24",
    "pdfplumber>=0.11",

    # ── Image Processing ─────────────────────────────────────────────
    "pillow>=10.4",
    "opencv-python-headless>=4.10",

    # ── CLIP (installed separately via pip install git+...) ──────────
    # clip @ git+https://github.com/openai/CLIP.git
    "torch>=2.0",
    "torchvision>=0.15",
    "ftfy",
    "regex",

    # ── Cache & Queue ────────────────────────────────────────────────
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",

    # ── Object Storage ───────────────────────────────────────────────
    "boto3>=1.35",

    # ── Data Validation ──────────────────────────────────────────────
    "pydantic>=2.8",
    "pydantic-settings>=2.4",

    # ── Logging & Observability ──────────────────────────────────────
    "structlog>=24.4",
    "opentelemetry-sdk>=1.27",

    # ── RAG Evaluation ───────────────────────────────────────────────
    "ragas>=0.2",

    # ── Utilities ────────────────────────────────────────────────────
    "tenacity>=9.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
